# Example ESPectre configuration with Display + Buttons Controller
# For LilyGO T-Display-S3 (ESP32-S3)
# Features: LCD display, 2 buttons control (mode + rate), raw CSI streaming

esphome:
  name: espectre-controller
  friendly_name: ESPectre Controller
  min_version: 2025.11.0
  project:
    name: francescopace.espectre
    version: controller-local

external_components:
  - source:
      type: local
      path: ../components
    components: [ espectre ]

esp32:
  board: lilygo-t-display-s3
  framework:
    type: esp-idf
    version: recommended

api:
  services:
    - service: set_mode
      variables:
        mode: int
    - service: set_rate
      variables:
        rate: int

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.42.32
    gateway: 192.168.42.1
    subnet: 255.255.255.0

logger:
  level: DEBUG
  baud_rate: 115200

spi:
  clk_pin: 18
  mosi_pin: 19
  miso_pin: 21
  cs_pin: 5
  dc_pin: 4
  rst_pin: 2

display:
  - platform: ili9xxx
    model: ST7789V
    width: 240
    height: 135
    rotation: 180
    lambda: |-
      it->clear();
      it->printf(55, 10, id(font_large), "ESPectre");
      
      const char* state_str = "IDLE";
      auto state = id(espectre_main).get_motion_state();
      if (state == 1) state_str = "MOTION";
      else if (state == 2) state_str = "CALIBRATING";
      
      it->printf(10, 50, id(font_medium), "State: %s", state_str);
      it->printf(10, 70, id(font_medium), "Rate: %u pps", id(espectre_main).get_traffic_generator_rate());
      it->printf(10, 90, id(font_medium), "Thresh: %.2f", id(espectre_main).get_segmentation_threshold());

font:
  - file: "font/roboto.ttf"
    id: font_large
    size: 24
  - file: "font/roboto.ttf"
    id: font_medium
    size: 16

binary_sensor:
  - platform: gpio
    pin:
      number: 0
      inverted: true
    name: "Mode Button"
    on_click:
      then:
        - lambda: |-
            static int mode = 0;
            mode = (mode + 1) % 4;
            ESP_LOGI("main", "Mode button: %d", mode);
            if (mode == 0) {
              id(espectre_main).set_traffic_generator_rate_runtime(100);
              id(traffic_rate_number).publish_state(100);
            } else if (mode == 1) {
              id(espectre_main).set_traffic_generator_rate_runtime(500);
              id(traffic_rate_number).publish_state(500);
            } else if (mode == 2) {
              id(espectre_main).set_traffic_generator_rate_runtime(100);
              id(traffic_rate_number).publish_state(100);
            } else {
              id(espectre_main).set_traffic_generator_rate_runtime(500);
              id(traffic_rate_number).publish_state(500);
            }
  - platform: gpio
    pin:
      number: 14
      inverted: true
    name: "Rate Button"
    on_click:
      then:
        - lambda: |-
            static int rate_level = 0;
            rate_level = (rate_level + 1) % 4;
            uint32_t rates[] = {10, 50, 100, 500};
            uint32_t new_rate = rates[rate_level];
            ESP_LOGI("main", "Rate button: %u pps", new_rate);
            id(espectre_main).set_traffic_generator_rate_runtime(new_rate);
            id(traffic_rate_number).publish_state(new_rate);

espectre:
  id: espectre_main
  segmentation_threshold: auto
  segmentation_window_size: 75
  detection_algorithm: mvs
  raw_csi_enabled: true
  raw_csi_server_ip: "192.168.42.175"
  raw_csi_server_port: 5001
  raw_csi_interval: 10
  traffic_generator_rate: 100
  traffic_generator_mode: dns

number:
  - platform: template
    name: "Traffic Rate"
    id: traffic_rate_number
    min_value: 0
    max_value: 1000
    step: 10
    initial_value: 100
    on_value:
      then:
        - lambda: |-
            id(espectre_main).set_traffic_generator_rate_runtime(x);

switch:
  - platform: template
    name: "NDP Mode"
    id: ndp_mode_switch
    optimistic: true