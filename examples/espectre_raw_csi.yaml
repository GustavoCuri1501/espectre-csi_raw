# Example ESPectre configuration with Raw CSI Streaming
# For LilyGO T-Display-S3 (ESP32-S3)

esphome:
  name: espectre-csi
  friendly_name: ESPectre CSI LilyGO
  min_version: 2025.11.0
  project:
    name: francescopace.espectre
    version: raw_csi-local

# Load ESPectre component from local directory
external_components:
  - source:
      type: local
      path: ../components
    components: [ espectre ]

esp32:
  board: lilygo-t-display-s3
  framework:
    type: esp-idf
    version: recommended

logger:
  level: DEBUG

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Static IP for ESP32-S3 LilyGO
  manual_ip:
    static_ip: 192.168.42.32
    gateway: 192.168.42.1
    subnet: 255.255.255.0

# ESPectre Component Configuration
espectre:
  # ============================================
  # MOTION DETECTION (Optional - keeps HA integration)
  # ============================================
  segmentation_threshold: auto  # auto, min, or numeric (0.1-10.0)
  segmentation_window_size: 75
  detection_algorithm: mvs      # mvs or ml

  # Optional sensors for Home Assistant
  movement_sensor:
    name: "Movement Score"
  motion_sensor:
    name: "Motion Binary"

  # ============================================
  # RAW CSI STREAMING (NEW FEATURE)
  # ============================================
  raw_csi_enabled: true                    # Enable raw CSI streaming
  raw_csi_server_ip: "192.168.42.175"      # IP do servidor Python
  raw_csi_server_port: 5001                # UDP port (default 5001)
  raw_csi_interval: 10                     # Send interval in ms (2-1000, default 10 = 100Hz)
  
  # ============================================
  # TRAFFIC GENERATOR (Optional)
  # ============================================
  traffic_generator_rate: 100    # WiFi traffic rate (0 = external traffic)
  traffic_generator_mode: dns    # dns or ping
  
  # ============================================
  # ADVANCED OPTIONS (Optional)
  # ============================================
  gain_lock: auto              # auto, enabled, or disabled
  lowpass_enabled: false       # Noise reduction filter
  hampel_enabled: false        # Outlier removal filter

# ============================================
# SECRET CONFIGURATION
# ============================================
# Create secrets.yaml file with:
# wifi_ssid: "YourWiFiNetwork"
# wifi_password: "YourWiFiPassword"
